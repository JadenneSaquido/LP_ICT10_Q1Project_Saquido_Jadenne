<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Website</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

<style>
body {
background: rgb(255, 248, 249);
min-height: 100vh;
color: rgb(51, 51, 51);
font-family: Arial, sans-serif;
margin: 0;
}

.navbar {
background: rgb(251, 173, 224);
padding: 12px 30px;
}

.navbar-brand, .nav-link {
color: rgb(255, 255, 255);
font-weight: bold;
}

.nav-link {
opacity: 0.8;
}

.main-card {
max-width: 480px;
margin: 40px auto;
background: rgb(255, 255, 255);
border-radius: 12px;
overflow: hidden;
}

.card-header-custom {
background: rgb(251, 173, 224);
color: rgb(255, 255, 255);
text-align: center;
padding: 25px;
}

.card-body-custom {
padding: 25px;
}

.form-group {
margin-bottom: 15px;
}

.form-group label {
font-weight: bold;
margin-bottom: 5px;
display: block;
}

.btn-custom {
width: 100%;
background: rgb(251, 173, 224);
color: rgb(255, 248, 249);
border: none;
padding: 10px;
border-radius: 6px;
font-weight: bold;
margin-top: 15px;
}

#sku_output {
margin-top: 20px;
text-align: center;
font-weight: bold;
color: rgb(44, 62, 80);
}

footer {
text-align: center;
color: rgb(44, 62, 80);
opacity: 0.7;
padding: 20px 0;
}

</style>
</head>
<body>

<nav class="navbar navbar-expand">
<a class="navbar-brand" href="#">Skewer</a>
<div class="navbar-nav ms-auto">
<a class="nav-link active" href="index.html">SKU Generator</a>
<a class="nav-link" href="https://jadennesaquido.github.io/LP_ICT10_Q1SkillsTest_Saquido_Jadenne/">🧾 Receipt Generator</a>
</div>
</div>
</nav>

<div class="main-card">
<div class="card-header-custom">
<h3>SKU Generator</h3>
</div>
<div class="card-body-custom">

<div class="form-group">
<label for="category">Category</label>
<select id="category" class="form-select">
<option value="Beverages">Beverages</option>
</select>
</div>

<div class="form-group">
<label for="product_name">Select Menu Item</label>
<select id="product_name" class="form-select">
<option value="Mocha">Mocha (₱120.00)</option>
<option value="Matcha">Matcha (₱150.00)</option>
<option value="Strawberry Latte">Strawberry Latte (₱140.00)</option>
<option value="Biscoff Affogato">Biscoff Affogato (₱198.00)</option>
<option value="Caramel Macchiato">Caramel Macchiato (₱160.00)</option>
</select>
</div>

<div class="form-group">
<label for="quantity">Stock Quantity</label>
<input type="number" id="quantity" class="form-control" placeholder="e.g. 50">
</div>

<button type="button" class="btn-custom" py-click="SKU_generator">Generate SKU</button>

<div id="sku_output">SKU will appear here.</div>

</div>
</div>

<footer>
Q1 10S I.C.T.: Business Website — Jadenne 🐰 Saquido
</footer>

<script type="py">
from pyscript import display, document

def SKU_generator(e):
    document.getElementById('sku_output').innerHTML = ""
    
    category = document.getElementById('category').value
    product_name = document.getElementById('product_name').value
    stock_qty = document.getElementById('quantity').value
    
    sku = category[:3].upper() + "-" + product_name[:4].upper().replace(" ", "") + "-" + str(stock_qty)
    
    display("SKU: " + sku, target='sku_output')
</script>

</body>
</html>
